.leaflet-container { font-family: inherit; background: #e8eeef; }
.rhs-popup { min-width: 210px; }
.rhs-popup-title { font-weight: 700; font-size: 15px; color: #0f172a; margin-bottom: 8px; padding-right: 6px; line-height: 1.3; }
.rhs-popup table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.rhs-popup th, .rhs-popup td { text-align: left; padding: 5px 6px; border-bottom: 1px solid #eef2f3; vertical-align: top; }
.rhs-popup th { color: #64748b; font-weight: 600; width: 38%; }
.rhs-popup td { color: #0f172a; word-break: break-word; }
.rhs-popup-empty { font-size: 12.5px; color: #64748b; margin: 0 0 4px; }
.leaflet-popup-content { margin: 14px 16px; line-height: 1.45; }
.rhs-user-dot { width: 18px; height: 18px; border-radius: 9999px; background: #2563eb; border: 3px solid #ffffff; box-shadow: 0 1px 6px rgba(0,0,0,0.45); position: relative; }
.rhs-user-dot::after { content: ''; position: absolute; inset: -10px; border-radius: 9999px; border: 2px solid rgba(37,99,235,0.55); animation: rhs-ping 2.2s ease-out infinite; }
@keyframes rhs-ping { 0% { transform: scale(0.45); opacity: 1; } 100% { transform: scale(1.25); opacity: 0; } }
.rhs-copy-link { display: flex; align-items: center; justify-content: center; gap: 7px; width: 100%; margin-top: 12px; padding: 11px 12px; border: 0; border-radius: 10px; background: #0f766e; color: #ffffff; font-size: 13.5px; font-weight: 700; cursor: pointer; }
.rhs-copy-link:hover { background: #0d655f; }
.rhs-copy-link:active { transform: scale(0.98); }
.rhs-copy-link.rhs-copied { background: #15803d; }
.rhs-copy-link svg { width: 15px; height: 15px; flex-shrink: 0; }
@media (max-width: 767px) {
  .leaflet-popup { max-width: calc(100vw - 32px) !important; }
  .leaflet-popup-content { width: auto !important; max-width: none; margin: 12px 14px; }
  .leaflet-bottom.leaflet-right { margin-bottom: 122px; }
  .leaflet-control-attribution { font-size: 9px; max-width: 46vw; }
